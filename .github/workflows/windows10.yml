name: Windows 10 and 11

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test save files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Mono and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ mono-mcs mono-runtime libmono-i18n-west4.0-cil

      - name: Run data tests
        run: sh test-windows10.sh

  build:
    name: Build Windows 10 and 11
    needs: test
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the WPF editor
        shell: cmd
        run: call build-windows10.cmd

      - name: Run the solution tests
        shell: cmd
        timeout-minutes: 5
        run: call test-windows10.cmd

      - name: Prepare download
        shell: pwsh
        working-directory: windows10
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'Descent3_Trainer-Win10-Win11'
          New-Item -Path $package -ItemType Directory -Force | Out-Null
          $output = 'D3SaveEditor.Gui/bin/Release/net48'
          $programFiles = 'D3SaveEditor.exe', 'D3SaveEditor.exe.config', 'D3SaveEditor.Core.dll'
          $programPaths = $programFiles | ForEach-Object { Join-Path $output $_ }
          Copy-Item -LiteralPath $programPaths -Destination $package
          Copy-Item -LiteralPath LICENSE, ../NOTICE.md -Destination $package
          $repository = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          @(
            'Descent 3 Savegame Editor for Windows 10 and 11'
            'Extract the ZIP and keep D3SaveEditor.Core.dll and D3SaveEditor.exe.config next to D3SaveEditor.exe.'
            'Run D3SaveEditor.exe and open a Descent 3 save file.'
            "Manual: $repository/blob/$env:GITHUB_SHA/windows10/README.md"
          ) | Set-Content -LiteralPath (Join-Path $package 'README.txt') -Encoding ascii
          @(
            'Corresponding source (including build scripts):'
            "$repository/archive/$env:GITHUB_SHA.zip"
          ) | Set-Content -LiteralPath (Join-Path $package 'SOURCE.txt') -Encoding ascii
          Get-FileHash -LiteralPath $programPaths -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path -Leaf $_.Path) } |
            Set-Content -LiteralPath (Join-Path $package 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload Windows 10 and 11 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Descent3_Trainer-Win10-Win11
          path: ${{ runner.temp }}/Descent3_Trainer-Win10-Win11/
          if-no-files-found: error
